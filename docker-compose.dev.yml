name: shekinah-bootstrap-dev
services:
  api:
    image: shekinah/api-dev:${APP_VERSION:-0.1.0}
    build:
      context: .
      target: base
    command: ["pnpm", "--filter", "@shekinah/api", "dev"]
    env_file: .env
    environment:
      NODE_ENV: development
      API_PORT: 3010
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    networks: [default, mongodb]
  admin:
    image: shekinah/admin-dev:${APP_VERSION:-0.1.0}
    build:
      context: .
      target: admin-dev
    env_file: .env
    environment:
      API_PROXY_TARGET: http://api:3010
    ports: ["0.0.0.0:${PORT:-${ADMIN_PORT:-5180}}:${PORT:-${ADMIN_PORT:-5180}}"]
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./packages:/app/packages
    depends_on: [api]
networks:
  mongodb:
    external: true
    name: ${MONGODB_NETWORK:-mongodb-network}
